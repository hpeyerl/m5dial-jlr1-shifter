; JLR CAN Shifter for M5Stack Dial
; Targets: M5Stack Dial (ESP32-S3)
; CAN: GPIO2=TX, GPIO1=RX via Grove port + M5 CAN Unit (SN65HVD230)

[env:m5stack-dial]
platform     = espressif32@6.5.0
board        = esp32-s3-devkitc-1
framework    = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_TWAI_ISR_IN_IRAM=y

lib_deps =
    m5stack/M5Unified@^0.1.16
    m5stack/M5GFX@^0.1.16
    madhephaestus/ESP32Encoder@^0.11.6

upload_speed    = 921600
monitor_speed   = 115200

build_type      = release
board_build.flash_mode = qio
board_build.flash_size = 16MB
